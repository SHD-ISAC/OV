# SPDX-License-Identifier: MIT

name: QCA-OWRT

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  config:
    name: ${{matrix.CONFIG}} (${{matrix.VARIANT}})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - CONFIG: IPQ807X-WIFI-YES
            VARIANT: standard
          - CONFIG: IPQ60XX-WIFI-YES
            VARIANT: standard
          - CONFIG: IPQ807X-WIFI-YES
            VARIANT: ap8220-1g-nand
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_VARIANT: ${{matrix.VARIANT}}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST || false}}
