#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          [[ "$WRT_CONFIG" =~ ^[A-Za-z0-9_-]+$ ]] && [ -f "./Config/$WRT_CONFIG.txt" ] || {
            echo "ERROR: unknown build configuration: $WRT_CONFIG"
            exit 1
          }
          WRT_WIFI=none
          case "$WRT_CONFIG" in
            *-WIFI-YES) WRT_WIFI=wifi-yes ;;
            *-WIFI-NO) WRT_WIFI=wifi-no ;;
          esac
          WRT_VARIANT=standard
          if [[ "$WRT_CONFIG" == IPQ807X* ]] && [ -f ./Patches/100-ap8220-1g-nand.patch ]; then
            WRT_VARIANT=ap8220-1g-nand
          fi
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_VARIANT=$WRT_VARIANT"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          # 这些源在 GENERAL/TEST 配置中已禁用；避免导入其 Kconfig 循环依赖。
          FEEDS_CONF=feeds.conf.default
          [ ! -f feeds.conf ] || FEEDS_CONF=feeds.conf
          sed -i -E '/^src-[^[:space:]]+[[:space:]]+(video|pon_drivers|pon_userspace)[[:space:]]/d' "$FEEDS_CONF"
          ./scripts/feeds update -a

          # Xray 将由 PassWall 官方依赖仓库提供。
          rm -rf feeds/packages/net/xray-core

          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Verify Xray Source
        run: |
          cd ./wrt/
          XRAY_MK=package/xray-core/Makefile
          WRT_XRAY_COMMIT=$(awk -F '\t' '$1 == "xray-core" && $2 == "Openwrt-Passwall/openwrt-passwall-packages" {print $3}' package-sources.tsv)
          [[ "$WRT_XRAY_COMMIT" =~ ^[0-9a-f]{40}$ ]] && [ -f "$XRAY_MK" ] || {
            echo "ERROR: Xray source or commit is missing"
            exit 1
          }
          # 对比本次克隆的固定提交，避免构建途中 main 更新导致误报。
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/Openwrt-Passwall/openwrt-passwall-packages/$WRT_XRAY_COMMIT/xray-core/Makefile" \
            -o xray-upstream.Makefile
          cmp "$XRAY_MK" xray-upstream.Makefile
          WRT_XRAY_VERSION=$(sed -n 's/^PKG_VERSION:=//p' "$XRAY_MK")
          [ -n "$WRT_XRAY_VERSION" ]
          echo "Xray: $WRT_XRAY_VERSION ($WRT_XRAY_COMMIT)"
          echo "WRT_XRAY_COMMIT=$WRT_XRAY_COMMIT" >> "$GITHUB_ENV"
          echo "WRT_XRAY_VERSION=$WRT_XRAY_VERSION" >> "$GITHUB_ENV"

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          python3 "$GITHUB_WORKSPACE/Scripts/Configure-Passwall2.py"
          make defconfig -j$(nproc)
          python3 "$GITHUB_WORKSPACE/Scripts/Configure-Passwall2.py" --verify
          make clean -j$(nproc)

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/
          mkdir -p ./upload/
          BUILD_LABEL="$WRT_CONFIG-$WRT_INFO-$WRT_BRANCH-$WRT_VARIANT-$WRT_DATE"
          cp .config "./upload/Config-$BUILD_LABEL.txt"
          cp package-sources.tsv "./upload/Sources-$BUILD_LABEL.txt"

          if [[ "$WRT_TEST" != 'true' ]]; then
            mapfile -d '' MANIFESTS < <(find ./bin/targets/ -type f -name '*.manifest' -print0)
            [ "${#MANIFESTS[@]}" -gt 0 ] || { echo "ERROR: no firmware manifest produced"; exit 1; }
            for MANIFEST in "${MANIFESTS[@]}"; do
              for PACKAGE in luci-app-passwall2 xray-core v2ray-geoip v2ray-geosite; do
                grep -q "^$PACKAGE - " "$MANIFEST" || { echo "ERROR: $PACKAGE missing from $MANIFEST"; exit 1; }
              done
            done
            WRT_KVER=$(sed -n 's/^kernel - //p' "${MANIFESTS[@]}" | sort -u | paste -sd ',' -)
            WRT_LIST=$(sed -n 's/^\(luci-\(app\|theme\)[^ ]*\) .*/\1/p' "${MANIFESTS[@]}" | sort -u | paste -sd ' ' -)
            echo "WRT_KVER=$WRT_KVER" >> "$GITHUB_ENV"
            echo "WRT_LIST=$WRT_LIST" >> "$GITHUB_ENV"

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +
            while IFS= read -r -d '' FILE; do
              BASE=$(basename "$FILE")
              EXT=${BASE#*.}
              NAME=${BASE%%.*}
              NAME=${NAME#*"$WRT_TARGET"}
              NEW_FILE="$WRT_TARGET$NAME-$WRT_INFO-$WRT_BRANCH-$WRT_WIFI-$WRT_VARIANT-$WRT_DATE.$EXT"
              mv "$FILE" "./upload/$NEW_FILE"
            done < <(find ./bin/targets/ -type f -iname "*$WRT_TARGET*" -print0)
            find ./bin/targets/ -type f -exec mv -t ./upload/ {} +
            make clean -j$(nproc)
          fi
          # 原始校验和在改名后失效，按最终发布文件重新生成。
          (cd upload && sha256sum -- * > sha256sums)

      - name: Release Firmware
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_VARIANT}}-${{env.WRT_DATE}}
          target_commitish: ${{github.sha}}
          files: ./wrt/upload/*
          fail_on_unmatched_files: true
          body: |
            按设备型号和 NAND 规格选择固件。
            standard 为标准配置；ap8220-1g-nand 仅适用于对应 NAND 改装的 AP8220。
            下载后可使用 sha256sums 校验文件。

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}
            固件变体：${{env.WRT_VARIANT}}
            构建配置提交：${{github.sha}}
            Xray：${{env.WRT_XRAY_VERSION}} (${{env.WRT_XRAY_COMMIT}})
            Loyalsoldier 数据：${{env.WRT_GEODATA_TAG}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
